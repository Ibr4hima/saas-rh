services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teranga
    ports:
      # Port hôte configurable : DB_PORT=5433 dans .env si 5432 est déjà pris
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d teranga']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
