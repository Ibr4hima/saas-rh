services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teranga
    ports:
      # Port hôte configurable : DB_PORT=5433 dans .env si 5432 est déjà pris
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d teranga']
      interval: 5s
      timeout: 3s
      retries: 10

  # Les courriels de développement : l'API les remet à Mailpit (SMTP 1025),
  # qui les garde tous dans une boîte de test, sans rien envoyer au dehors.
  # Lecture sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_WEB_PORT:-8025}:8025'

volumes:
  db-data:
